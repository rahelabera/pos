apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-backend
  labels:
    app: pos-backend
    project: pos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pos-backend
  template:
    metadata:
      labels:
        app: pos-backend
        project: pos
    spec:
      imagePullSecrets:
        - name: regcred 
      containers:
      - name: pos-backend
        image: harbor.cbe.com.et/pos/backend:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: pos-backend-configmap